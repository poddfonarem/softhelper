<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftHelper - помічник системного адміністратора</title>
    <link rel="icon" href="images/favicon.webp?v=1.0" type="image/webp">
    <meta name="description" content="SoftHelper - helper for system administrators">
    <meta name="keywords" content="HTML, CSS, JavaScript, soft, contact, system, administrator">
    <meta name="author" content="poddfonarem">
    <link rel="stylesheet" href="css/style.min.css?v=1.3">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
    <link rel="preload" href="images/symantec.webp" as="image" type="image/webp" fetchpriority="high">
</head>
<body>
    <div class="loader" id="loader">
        <div class="prism-shape"></div>
        <div class="logo-text loader-content">
            <div class="prism">SOFTHELPER</div>
        </div>
    </div>
    <header class="header" id="header">
        <nav class="nav-container">
            <a href="https://poddfonarem.github.io/softhelper/" class="logo">
                <div class="logo-icon">
                    <div class="logo-prism">
                        <div class="prism-shape"></div>
                    </div>
                </div>
                <span class="logo-text">
                    <span class="prism">SOFTHELPER</span>
                </span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="#soft" class="nav-link active">Програми</a></li>
                <li><a href="https://github.com/poddfonarem/windows-upgrade-all" target="_blank" class="autoupdate">AutoUpdate</a></li>
                <li><a href="#" onclick="searchAndGoTo('7-zip')" class="nav-link sevenzip">7z.exe</a></li>
                <li class="search-container">
                    <div class="search-column"> 
                        <div class="search-wrapper">
                            <input type="text" id="softSearch" placeholder="Пошук програм..." 
                                oninput="showSuggestions(this.value)" onkeydown="if(event.key === 'Enter') 
                                searchAndGoTo(this.value)" autocomplete="off">
                                
                            <button id="clearBtn" aria-label="Очистити" onclick="clearSearch()" style="display: none;">
                                <i class="fa-solid fa-xmark"></i>
                            </button>

                            <button class="search-btn" aria-label="Шукати" onclick="searchAndGoTo(document.getElementById('softSearch').value)">
                                 <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                            
                        </div>
                        <div id="autocompleteResults" class="autocomplete-list"></div>
                        <div id="searchMessage" class="search-message"></div>
                    </div>
                </li>
            </ul>
            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero" id="soft">
            <div class="carousel-container">
                <div class="carousel" id="carousel"></div>
                
                <div class="carousel-controls">
                    <button class="carousel-btn" aria-label="Назад" id="prevBtn">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button class="carousel-btn" aria-label="Далі" id="nextBtn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="copyright">&copy; <script>document.write(new Date().getFullYear());</script> SoftHelper. All rights reserved.</div>
        <div class="footer-credits">Designed by poddfonarem</div>
    </footer>
    <script rel="preload" as="script" type="module" src="js/main.min.js?v=1.3" crossorigin="anonymous" async></script>
</body>

</html>
